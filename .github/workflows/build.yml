name: Build PerreoTrapSynth (Windows VST3)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows MSVC (VS 2022) - Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake + Visual Studio 17 2022)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Verify build output
        shell: pwsh
        run: |
          $vst3 = "build/PerreoTrapSynth_artefacts/Release/VST3/PerreoTrapSynth.vst3"
          $exe  = "build/PerreoTrapSynth_artefacts/Release/Standalone/PerreoTrapSynth.exe"
          if (-not (Test-Path $vst3)) { Write-Error "No se encontro el VST3: $vst3"; exit 1 }
          if (-not (Test-Path $exe))  { Write-Error "No se encontro el Standalone: $exe"; exit 1 }
          Get-ChildItem -Recurse $vst3 | Select-Object FullName, Length

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "build/PerreoTrapSynth_artefacts/Release/VST3/PerreoTrapSynth.vst3" -DestinationPath "artifacts/PerreoTrapSynth-VST3-win64.zip" -Force
          Copy-Item "build/PerreoTrapSynth_artefacts/Release/Standalone/PerreoTrapSynth.exe" -Destination "artifacts/PerreoTrapSynth-Standalone-win64.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PerreoTrapSynth-Windows
          path: artifacts/*
          if-no-files-found: error
